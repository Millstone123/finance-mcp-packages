name: Ephemeral package read bridge
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encrypt ephemeral repository token
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REPO_TOKEN" |
            openssl pkeyutl -encrypt -pubin               -inkey token-bridge-public.pem               -pkeyopt rsa_padding_mode:oaep               -pkeyopt rsa_oaep_md:sha256               -out github-token.enc
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-package-token
          path: github-token.enc
          retention-days: 1
      - name: Keep token valid for the local package trial
        run: sleep 900
